# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: reasonfuse
requiredVersions:
    azd: '=1.33.0'
    extensions:
        azure.ai.agents: '=1.0.0-beta.13'
        azure.ai.projects: '=1.0.0-beta.9'
infra:
    provider: microsoft.foundry
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - name: gpt-5-mini
              model:
                format: OpenAI
                name: gpt-5-mini
                version: '2025-08-07'
              sku:
                name: GlobalStandard
                capacity: 10
    operations-tools:
        host: azure.ai.toolbox
        uses:
            - ai-project
        description: Bounded deterministic Operations MCP tools for ReasonFuse cloud validation.
        tools:
            - type: mcp
              server_label: reasonfuse-operations
              server_url: ${OPERATIONS_MCP_ENDPOINT}
              require_approval:
                  never:
                      - operations___service_status
                  always:
                      - operations___restart_service
                      - operations___reset
    reasonfuse:
        host: azure.ai.agent
        project: .
        language: python
        uses:
            - ai-project
            - operations-tools
        kind: hosted
        name: reasonfuse
        description: Lean ReasonFuse Microsoft Foundry Hosted Agent.
        toolboxes:
            - operations-tools
        codeConfiguration:
            runtime: python_3_13
            entryPoint: src/main.py
        protocols:
            - protocol: responses
              version: 2.0.0
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
            REASONFUSE_ENABLED: ${REASONFUSE_ENABLED}
            REASONFUSE_CONTRACT_JSON: ${REASONFUSE_CONTRACT_JSON}
            TOOLBOX_NAME: operations-tools
        container:
            resources:
                cpu: '1'
                memory: 2Gi
