openapi: 3.0.3
info:
  title: ReasonFuse deterministic Operations API
  version: 2.0.0
servers:
  - url: ${OPERATIONS_ENDPOINT}
paths:
  /dns-resolution:
    post:
      operationId: dns_resolution
      description: Return deterministic INCONCLUSIVE DNS status for the requested hostname.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
              required: [hostname]
              additionalProperties: false
      responses:
        '200':
          description: Deterministic DNS result
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname: {type: string}
                  status: {type: string}
  /restart-service:
    post:
      operationId: restart_service
      description: R2 HIGH_IMPACT_WRITE validation action. Simulates a restart and increments its execution counter. Always requires approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_name:
                  type: string
              required: [service_name]
              additionalProperties: false
      responses:
        '200':
          description: Simulated restart result
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_name: {type: string}
                  status: {type: string}
                  accepted: {type: boolean}
                  generation: {type: string}
  /service-status:
    post:
      operationId: service_status
      description: Read the current deterministic service health for a named resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_name: {type: string}
              required: [service_name]
              additionalProperties: false
      responses:
        '200':
          description: Current service state
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: {type: string}
                  service_name: {type: string}
                  service_health: {type: string}
                  generation: {type: string}
                  status: {type: string}
                  world_state: {type: object}
  /database-health:
    post:
      operationId: database_health
      description: Read deterministic database health for a named resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_name: {type: string}
              required: [service_name]
              additionalProperties: false
      responses:
        '200':
          description: Current database state
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource: {type: string}
                  service_health: {type: string}
                  generation: {type: string}
                  status: {type: string}
                  world_state: {type: object}
  /retrieval-fixture:
    post:
      operationId: retrieval_fixture
      description: Deterministic Phase 2 retrieval-churn fixture; not Foundry IQ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: {type: string}
              required: [query]
              additionalProperties: false
      responses:
        '200':
          description: Fixed non-IQ retrieval evidence
