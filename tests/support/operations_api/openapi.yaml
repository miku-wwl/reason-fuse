openapi: 3.0.3
info:
  title: ReasonFuse deterministic Operations API
  version: 1.0.0
servers:
  - url: ${OPERATIONS_ENDPOINT}
paths:
  /dns-resolution:
    post:
      operationId: dns_resolution
      description: Return deterministic INCONCLUSIVE DNS status for the requested hostname.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
              required: [hostname]
              additionalProperties: false
      responses:
        '200':
          description: Deterministic DNS result
          content:
            application/json:
              schema:
                type: object
                properties:
                  hostname: {type: string}
                  status: {type: string}
  /restart-service:
    post:
      operationId: restart_service
      description: R2 HIGH_IMPACT_WRITE validation action. Simulates a restart and increments its execution counter. Always requires approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_name:
                  type: string
              required: [service_name]
              additionalProperties: false
      responses:
        '200':
          description: Simulated restart result
          content:
            application/json:
              schema:
                type: object
                properties:
                  service_name: {type: string}
                  status: {type: string}
