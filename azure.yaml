# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: reasonfuse
requiredVersions:
    azd: '=1.33.0'
    extensions:
        azure.ai.agents: '=1.0.0-beta.13'
        azure.ai.projects: '=1.0.0-beta.9'
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - name: gpt-5-mini
              model:
                format: OpenAI
                name: gpt-5-mini
                version: '2025-08-07'
              sku:
                name: GlobalStandard
                capacity: 10
    stable:
        host: azure.ai.agent
        project: .
        language: python
        uses:
            - ai-project
        kind: hosted
        name: reasonfuse-phase1-stable
        description: Frozen architecture Phase 1 runtime validation stable backend.
        codeConfiguration:
            runtime: python_3_13
            entryPoint: src/main.py
        protocols:
            - protocol: responses
              version: 2.0.0
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
            RELEASE_ROLE: stable
            TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
            FOUNDRY_IQ_MCP_ENDPOINT: ${FOUNDRY_IQ_MCP_ENDPOINT}
            REASONFUSE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${REASONFUSE_APPLICATIONINSIGHTS_CONNECTION_STRING}
            REASONFUSE_TRACE_FLUSH: 'true'
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
            REASONFUSE_PROFILE: ${REASONFUSE_PROFILE}
            REASONFUSE_ENABLED: ${REASONFUSE_ENABLED}
            REASONFUSE_CONTRACT_JSON: ${REASONFUSE_CONTRACT_JSON}
        container:
            resources:
                cpu: '1'
                memory: 2Gi
    candidate:
        host: azure.ai.agent
        project: .
        language: python
        uses:
            - ai-project
        kind: hosted
        name: reasonfuse-phase1-candidate
        description: Frozen architecture Phase 1 runtime validation candidate backend.
        codeConfiguration:
            runtime: python_3_13
            entryPoint: src/main.py
        protocols:
            - protocol: responses
              version: 2.0.0
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5-mini
            RELEASE_ROLE: candidate
            TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
            FOUNDRY_IQ_MCP_ENDPOINT: ${FOUNDRY_IQ_MCP_ENDPOINT}
            REASONFUSE_APPLICATIONINSIGHTS_CONNECTION_STRING: ${REASONFUSE_APPLICATIONINSIGHTS_CONNECTION_STRING}
            REASONFUSE_TRACE_FLUSH: 'true'
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
            REASONFUSE_PROFILE: ${REASONFUSE_PROFILE}
            REASONFUSE_ENABLED: ${REASONFUSE_ENABLED}
            REASONFUSE_CONTRACT_JSON: ${REASONFUSE_CONTRACT_JSON}
        container:
            resources:
                cpu: '1'
                memory: 2Gi
infra:
    provider: terraform
